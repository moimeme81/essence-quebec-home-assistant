name: Validation Home Assistant & HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: Validation HACS
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout du code
        uses: "actions/checkout@v4"
      - name: Vérification des règles HACS
        uses: "hacs/action@main"
        with:
          category: "integration"

  hassfest:
    name: Validation Hassfest (Home Assistant)
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout du code
        uses: "actions/checkout@v4"
      - name: Vérification de l'intégration
        uses: "home-assistant/actions/hassfest@master"

  tests:
    name: Tests unitaires
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q
