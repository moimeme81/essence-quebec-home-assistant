blueprint:
  name: Régie Essence - Chercher une station
  description: "Génère un script qui cherche les stations d'essence selon vos critères et envoie une notification avec navigation intégrée (Compatible Android Auto & Apple CarPlay)."
  domain: script
  source_url: https://raw.githubusercontent.com/moimeme81/essence-quebec-home-assistant/refs/heads/main/blueprint/script/find_gas.yaml
  input:
    location_entity:
      name: Entité de localisation (GPS)
      description: "Choisissez la personne ou le téléphone (device_tracker) pour utiliser sa position."
      selector:
        entity:
          domain:
            - person
            - device_tracker
            - zone
    search_mode:
      name: Mode de recherche
      default: "cheapest"
      selector:
        select:
          options:
            - label: Les moins chères (Prix)
              value: "cheapest"
            - label: Les plus proches (Distance)
              value: "closest"
    gas_type:
      name: Type d'essence
      default: "Régulier"
      selector:
        select:
          options:
            - label: Régulier / Ordinaire
              value: "Régulier"
            - label: Super / Premium
              value: "Super"
            - label: Diesel
              value: "Diesel"
    radius:
      name: Rayon de recherche (km)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          mode: slider
    limit:
      name: Nombre de résultats
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: slider
    nav_app:
      name: Application GPS
      default: "google_maps"
      selector:
        select:
          options:
            - label: Google Maps
              value: "google_maps"
            - label: Waze
              value: "waze"
            - label: Apple Maps
              value: "apple_maps"
    device_os:
      name: Système d'exploitation du téléphone
      description: "Nécessaire pour adapter le format des boutons interactifs."
      default: "android"
      selector:
        select:
          options:
            - label: Android
              value: "android"
            - label: iOS (iPhone)
              value: "ios"
    notify_phone:
      name: Téléphone à notifier
      selector:
        entity:
          integration: mobile_app
          domain: device_tracker

sequence:
  - variables:
      location_entity: !input location_entity
      search_mode: !input search_mode
      radius_km: !input radius
      nav_app: !input nav_app
      device_os: !input device_os
      raw_phone_entity: !input notify_phone
      notify_service: "{{ raw_phone_entity | replace('device_tracker.', 'notify.mobile_app_') }}"
      lat: "{{ state_attr(location_entity, 'latitude') | float(0) }}"
      lon: "{{ state_attr(location_entity, 'longitude') | float(0) }}"

  - condition: template
    value_template: "{{ lat != 0 and lon != 0 }}"

  - action: regie_essence_quebec.find_closest_stations
    data:
      latitude: "{{ lat }}"
      longitude: "{{ lon }}"
      radius: !input radius
      limit: !input limit
      gas_type: !input gas_type
    response_variable: gas_results

  - variables:
      stations: >
        {% if search_mode == 'closest' %}
          {{ gas_results.closest }}
        {% else %}
          {{ gas_results.cheapest }}
        {% endif %}
      gas_title: >
        {% if search_mode == 'closest' %}
          Stations les plus proches
        {% else %}
          Stations les moins chères
        {% endif %}
      gas_message: >
        {% if stations | length == 0 %}
          Aucune station trouvée dans un rayon de {{ radius_km }} km.
        {% else %}
          {% for s in stations %}
            {{ loop.index }}. {{ s.brand }} à {{ s.distance_km }}km : {{ s.target_price }}¢/L
          {% endfor %}
        {% endif %}
      uri_1: >
        {% set s = stations[0] %}
        {% if nav_app == 'waze' %}waze://?ll={{ s.latitude }},{{ s.longitude }}&navigate=yes
        {% elif nav_app == 'apple_maps' %}http://maps.apple.com/?daddr={{ s.latitude }},{{ s.longitude }}
        {% else %}google.navigation:q={{ s.latitude }},{{ s.longitude }}
        {% endif %}
      uri_2: >
        {% if stations | length > 1 %}{% set s = stations[1] %}
          {% if nav_app == 'waze' %}waze://?ll={{ s.latitude }},{{ s.longitude }}&navigate=yes
          {% elif nav_app == 'apple_maps' %}http://maps.apple.com/?daddr={{ s.latitude }},{{ s.longitude }}
          {% else %}google.navigation:q={{ s.latitude }},{{ s.longitude }}
          {% endif %}
        {% else %}{% endif %}
      uri_3: >
        {% if stations | length > 2 %}{% set s = stations[2] %}
          {% if nav_app == 'waze' %}waze://?ll={{ s.latitude }},{{ s.longitude }}&navigate=yes
          {% elif nav_app == 'apple_maps' %}http://maps.apple.com/?daddr={{ s.latitude }},{{ s.longitude }}
          {% else %}google.navigation:q={{ s.latitude }},{{ s.longitude }}
          {% endif %}
        {% else %}{% endif %}

  - choose:
      # ==========================================
      # SCENARIO A: NO STATIONS FOUND
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ stations | length == 0 }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: "{{ gas_title }}"
              message: "{{ gas_message }}"
              data:
                ttl: 0
                priority: high
                channel: driving_alerts
                push:
                  interruption-level: time-sensitive

      # ==========================================
      # SCENARIO B: STATIONS FOUND & iOS
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ device_os == 'ios' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: "{{ gas_title }}"
              message: "{{ gas_message }}"
              data:
                push:
                  interruption-level: time-sensitive
                clickAction: "{{ uri_1 | trim }}"
                actions: >
                  {% set ns = namespace(btns=[]) %}
                  {% for s in stations[:3] %}
                    {% set uri = "" %}
                    {% if loop.index == 1 %}{% set uri = uri_1 | trim %}
                    {% elif loop.index == 2 %}{% set uri = uri_2 | trim %}
                    {% else %}{% set uri = uri_3 | trim %}{% endif %}
                    {% set ns.btns = ns.btns + [{"action": "URI", "title": "📍 #" ~ loop.index ~ " " ~ s.brand, "uri": uri}] %}
                  {% endfor %}
                  {{ ns.btns }}

      # ==========================================
      # SCENARIO C: STATIONS FOUND & ANDROID
      # ==========================================
      - conditions:
          - condition: template
            value_template: "{{ device_os == 'android' }}"
        sequence:
          - action: "{{ notify_service }}"
            data:
              title: "{{ gas_title }}"
              message: "{{ gas_message }}"
              data:
                ttl: 0
                priority: high
                car_ui: true
                channel: driving_alerts
                clickAction: "{{ uri_1 | trim }}"
                actions:
                  - action: NAV_STATION_1
                    title: "📍 #1 {{ stations[0].brand }} ({{ stations[0].distance_km }}km)"
                  - action: NAV_STATION_2
                    title: "📍 #2 {{ stations[1].brand if stations | length > 1 else '—' }} ({{ stations[1].distance_km if stations | length > 1 else '' }}km)"
                  - action: NAV_STATION_3
                    title: "📍 #3 {{ stations[2].brand if stations | length > 2 else '—' }} ({{ stations[2].distance_km if stations | length > 2 else '' }}km)"

          - wait_for_trigger:
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: NAV_STATION_1
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: NAV_STATION_2
              - platform: event
                event_type: mobile_app_notification_action
                event_data:
                  action: NAV_STATION_3
            timeout: "00:05:00"
            continue_on_timeout: false

          - variables:
              tapped_uri: >
                {% set a = wait.trigger.event.data.action %}
                {% if a == 'NAV_STATION_1' %}{{ uri_1 | trim }}
                {% elif a == 'NAV_STATION_2' %}{{ uri_2 | trim }}
                {% else %}{{ uri_3 | trim }}
                {% endif %}

          - action: "{{ notify_service }}"
            data:
              message: command_activity
              data:
                intent_action: android.intent.action.VIEW
                intent_uri: "{{ tapped_uri }}"
